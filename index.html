<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wild Quest - Educational Game</title>
  <meta name="description"
    content="A fun and educational game where you guess the animal based on progressively revealed clues. Perfect for kids and nature lovers!" />
  <link rel="stylesheet" href="/src/style.css" />

  <!-- Open Graph -->
  <meta property="og:title" content="Wild Quest" />
  <meta property="og:description" content="Can you guess the animal from the clues? Test your knowledge!" />
  <meta property="og:image" content="/preview.png" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://wildquest.net" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet" />
</head>

<body>
  <div id="landing-page">
    <div class="landing-content">
      <img src="/src/assets/logo.png" alt="Wild Quest Logo" class="game-logo" />
      <button id="start-btn" class="primary-btn pulse">Start Game</button>
    </div>
  </div>

  <div id="app" class="hidden">
    <header>
      <h1>Guess the Animal</h1>
      <p>Read the clues. Guess the creature.</p>
    </header>

    <main class="game-container">
      <div id="image-container" class="hidden">
        <!-- Image injected here on win/loss -->
      </div>

      <div class="clues-section">
        <h2>Clues</h2>
        <ul id="clues-list">
          <!-- Clues injected here -->
        </ul>
      </div>

      <div id="choices-container" class="choices-grid">
        <!-- Choice buttons injected here -->
      </div>

      <div id="message-area" class="message" aria-live="polite" aria-atomic="true"></div>

      <button id="next-btn" class="hidden">Next Animal</button>
      <button id="restart-btn" class="hidden">Play Again</button>
    </main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
